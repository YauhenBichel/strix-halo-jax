[project]
name = "strix-halo-jax"
version = "0.1.0"
description = "Run JAX and MuJoCo MJX on the AMD Ryzen AI MAX (Strix Halo, gfx1151) GPU from pip wheels, and jaxcheck: a hang-safe test of which wheel set works"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yauhen Bichel" }]
requires-python = "==3.12.*"
keywords = ["jax", "rocm", "amd", "strix-halo", "ryzen-ai-max", "gfx1151", "mujoco", "mjx", "gpu", "xla"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
# jaxcheck itself is standard library only: it tests the JAX installed next to it, so installing
# it must not change that JAX. The tested sets are the extras.
dependencies = []

[project.optional-dependencies]
# The working GPU set (11 September 2026): JAX's ROCm plugin from PyPI + AMD's gfx1151 library wheels
# (the rocm* wheels come from https://repo.amd.com/rocm/whl/gfx1151/, not PyPI).
gfx1151 = [
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "jax-rocm7-plugin==0.11.1",
    "jax-rocm7-pjrt==0.11.1",
    "rocm[libraries]==7.13.0",
    "rocm-sdk-core==7.13.0",
    "rocm-sdk-libraries-gfx1151==7.13.0",
]
# The simulator stages (mjx_reset, mjx_step) of jaxcheck.
mjx = ["playground==0.2.0", "mujoco==3.13.0", "mujoco-mjx==3.13.0"]

[project.scripts]
jaxcheck = "jaxcheck:main"

[project.urls]
Homepage = "https://github.com/YauhenBichel/strix-halo-jax"
Issues = "https://github.com/YauhenBichel/strix-halo-jax/issues"
Changelog = "https://github.com/YauhenBichel/strix-halo-jax/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "jax==0.11.1", "jaxlib==0.11.1"]   # the tests run real CPU stages

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["jaxcheck.py"]

[tool.hatch.build.targets.sdist]
include = ["jaxcheck.py", "rocm-run", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "amd-gfx1151"
url = "https://repo.amd.com/rocm/whl/gfx1151/"
explicit = true

[tool.uv.sources]
rocm = { index = "amd-gfx1151" }
rocm-sdk-core = { index = "amd-gfx1151" }
rocm-sdk-libraries-gfx1151 = { index = "amd-gfx1151" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

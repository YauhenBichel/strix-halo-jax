name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Environment from the lock (CPU JAX; the gfx1151 extra needs the GPU and is not installed here)
        run: uv sync --frozen
      - name: Tests (stage classification with scripted stages on CPU; the GPU itself cannot be tested in CI)
        run: uv run --frozen python -m pytest -q
